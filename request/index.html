  var payload=Object.freeze({centerName:v('center'),contactName:v('contact'),email:v('email'),country:v('country'),countryOther:v('countryOther'),countryLabel:sel.value==='OTHER'?v('countryOther'):(sel.options[sel.selectedIndex]||{}).textContent,dialCode:sel.value==='OTHER'?v('dialOther').replace(/\D/g,''):v('dialCode'),phone:v('phone'),website:v('website'),formToken:v('formToken'),consent:document.getElementById('consent').checked});
  var controls=['center','contact','email','country','countryOther','dialCode','dialOther','phone','consent','send'].map(function(id){return document.getElementById(id);});function lock(on){controls.forEach(function(x){x.disabled=on;});}
  lock(true);status.textContent='جارٍ إرسال الطلب…';status.style.color='#5E6B64';
  (function send(){google.script.run.withSuccessHandler(function(r){if(!r.ok&&r.code==='BUSY'&&tries<2){tries++;status.textContent='النظام مشغول؛ نعيد إرسال الطلب نفسه تلقائيًا…';setTimeout(send,(r.retryAfterMs||2000)*tries+Math.floor(Math.random()*1000));return;}if(r.ok){showCard(r.data,payload);return;}lock(false);status.style.color='';status.textContent=r.error;}).withFailureHandler(function(){lock(false);status.style.color='';status.textContent='تعذر الإرسال. يمكنك إعادة المحاولة.';}).api('centerRequest',null,payload);})();
};
