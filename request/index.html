.rafiq-logo{display:inline-flex;align-items:center;gap:20px;direction:rtl;text-decoration:none}
.rafiq-logo svg{width:72px;height:72px;flex:none}
.rafiq-logo .word{font-family:'Reem Kufi',sans-serif;font-weight:700;font-size:44px;line-height:1;color:#0E5A3F}
.rafiq-logo .tag{font-family:Cairo,sans-serif;font-weight:600;font-size:13px;color:#8A6A1F;margin-top:4px}
/* الحركة عند التحميل: الصفحتان تنفتحان ثم يظهر الرأسان ثم الكلمة */
.rafiq-logo.rq-play .pg{transform-box:fill-box;animation:rq-open .7s cubic-bezier(.2,.8,.2,1) both}
.rafiq-logo .pg-r{transform-origin:left bottom}
.rafiq-logo .pg-l{transform-origin:right bottom;animation-delay:.08s}
.rafiq-logo.rq-play .hd{transform-box:fill-box;transform-origin:center;animation:rq-pop .5s cubic-bezier(.3,1.5,.5,1) both}
.rafiq-logo .hd-1{animation-delay:.55s}.rafiq-logo .hd-2{animation-delay:.68s}
.rafiq-logo.rq-play .txt{animation:rq-fade .6s ease-out .8s both}
/* حركة خفيفة جدًا عند المرور: إيماءة الرأسين */
.rafiq-logo:hover .hd-1{animation:rq-nod .6s ease-in-out}
.rafiq-logo:hover .hd-2{animation:rq-nod .6s ease-in-out .1s}
@keyframes rq-open{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}
@keyframes rq-pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes rq-fade{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@keyframes rq-nod{0%,100%{transform:none}50%{transform:translateY(-4px)}}

splay:inline-flex}.login-story{background:var(--rafiq-green-dark)}.login-story .eyebrow{color:var(--rafiq-gold-light)}.login-story p{color:#dcebe4}.login-brand-link svg{width:72px;height:72px}.login-links{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin-top:20px;font-size:14px}.login-links a{color:var(--rafiq-green);text-underline-offset:5px}.login-links a:focus-visible{outline:2px solid var(--rafiq-gold);outline-offset:4px}</style></head><body><main><header><a class="rafiq-logo" data-brand-home aria-label="رفيق" href="../"><svg viewBox="0 0 150 150" aria-hidden="true">
    <rect x="5" y="5" width="140" height="140" rx="36" fill="#0E5A3F"/>
    <path class="pg pg-r" d="M75 112 Q55 92 30 96 V70 Q55 66 75 86 Z" fill="#FFFFFF"/>

    <circle class="hd hd-2" cx="93" cy="46" r="13" fill="#D9AE4E"/>
  </svg><span class="txt"><span class="word">رفيق</span><span class="tag">إدارة مراكز تحفيظ القرآن الكريم</span></span></a></header><h1>طلب فتح مركز في رفيق</h1><p>أرسل بيانات مركزك لمراجعتها. قبول الطلب لا يعني إنشاء المركز أو تفعيل حسابه فورًا.</p><form id="request"><label>اسم المركز<input id="center" required maxlength="100"></label><label>اسم المسؤول<input id="contact" required maxlength="100"></label><label>البريد الإلكتروني<input id="email" type="email" required maxlength="150"></label><label>رقم التواصل<input id="phone" type="tel" required maxlength="30"></label><input type="hidden" id="formToken" value=""><label style="display:none" aria-hidden="true">الموقع<input id="website" tabindex="-1" autocomplete="off"></label><label><input id="consent" type="checkbox" required>أوافق على حفظ هذه البيانات لدى إدارة رفيق لمراجعة طلب المركز.</label><button id="send">إرسال الطلب</button></form><p id="status" role="status"></p></main><script>
// The payload is captured ONCE at submit; automatic BUSY retries resend exactly that object.
// Fields stay locked while the request is in flight so what is shown is what is being sent.
document.getElementById('request').onsubmit=function(e){e.preventDefault();var status=document.getElementById('status'),tries=0,v=function(id){return document.getElementById(id).value;};
  var payload=Object.freeze({centerName:v('center'),contactName:v('contact'),email:v('email'),phone:v('phone'),website:v('website'),formToken:v('formToken'),consent:document.getElementById('consent').checked});
  var controls=['center','contact','email','phone','consent','send'].map(function(id){return document.getElementById(id);});function lock(on){controls.forEach(function(x){x.disabled=on;});}
  lock(true);status.textContent='جارٍ إرسال الطلب…';
  (function send(){google.script.run.withSuccessHandler(function(r){if(!r.ok&&r.code==='BUSY'&&tries<2){tries++;status.textContent='النظام مشغول؛ نعيد إرسال الطلب نفسه تلقائيًا…';setTimeout(send,(r.retryAfterMs||2000)*tries+Math.floor(Math.random()*1000));return;}lock(false);status.textContent=r.ok?'تم استلام الطلب. الرقم المرجعي: '+r.data.reference:r.error;}).withFailureHandler(function(){lock(false);status.textContent='تعذر الإرسال. يمكنك إعادة المحاولة.';}).api('centerRequest',null,payload);})();
};

</span></footer><script>(function(){let seen=true;try{seen=sessionStorage.getItem('rafiq-brand-played')==='1';sessionStorage.setItem('rafiq-brand-played','1');}catch(e){}if(!seen&&!matchMedia('(prefers-reduced-motion: reduce)').matches)document.querySelectorAll('.rafiq-logo').forEach(el=>{if(el.getClientRects().length)el.classList.add('rq-play');});})();</script><script>(function(){var send=document.getElementById('send'),status=document.getElementById('status'),field=document.getElementById('formToken');if(!send||!field||!window.rafiqCall)return;send.disabled=true;status.textContent='جارٍ تجهيز النموذج…';var tries=0;(function get(){window.rafiqCall('requestFormToken',{},function(r){if(r&&r.ok&&r.data&&typeof r.data.formToken==='string'){field.value=r.data.formToken;send.disabled=false;status.textContent='';return;}if(r&&r.code==='BUSY'&&tries<2){tries++;setTimeout(get,1500*tries);return;}status.textContent='تعذر تجهيز النموذج. أعد تحميل الصفحة.';},function(){if(tries<2){tries++;setTimeout(get,1500*tries);return;}status.textContent='تعذر الاتصال. تحقق من الإنترنت ثم أعد تحميل الصفحة.';});})();})();</script></body></html>
